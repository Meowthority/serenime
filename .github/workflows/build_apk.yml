name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/Serenime-ID.apk

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Serenime ID v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## 📱 Serenime ID Android APK
            Aplikasi berhasil di-build otomatis dari commit terbaru!
            
            ### Cara Install di HP:
            1. Download file **`Serenime-ID.apk`** di bawah.
            2. Buka file di HP Android Anda dan klik **Install**.
          files: release_apk/Serenime-ID.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: Serenime-ID-apk
          path: release_apk/Serenime-ID.apk
